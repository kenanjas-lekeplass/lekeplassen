<script>
  // always load files from the Lekeplassen folder, even if the address was saved without the last "/"
  (function () {
    var p = location.pathname;
    if (/\/lekeplassen$/.test(p)) { location.replace(p + '/' + location.search + location.hash); }
    var dir = p.replace(/[^\/]*$/, '');
    if (/\/lekeplassen$/.test(p)) { dir = p + '/'; }
    document.write('<base href="' + dir + '">');
  })();
</script>

.faller{position:absolute;left:0;top:0;width:80px;height:80px;font-size:70px;line-height:80px;text-align:center}

.clockch{position:absolute;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center}

/* Balloons */
#bArea{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:-webkit-linear-gradient(top,#bfe6ff,#eaf7ff);background:linear-gradient(#bfe6ff,#eaf7ff)}

.balloon:after{content:'';position:absolute;left:55px;top:138px;width:2px;height:70px;background:rgba(0,0,0,.25)}

#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50}
.conf{position:absolute;top:-80px;-webkit-animation-name:fall;animation-name:fall;-webkit-animation-timing-function:linear;animation-timing-function:linear;-webkit-animation-fill-mode:forwards;animation-fill-mode:forwards}
.bump{-webkit-animation:bump .45s;animation:bump .45s}
.wobble{-webkit-animation:wobble .5s;animation:wobble .5s}
@-webkit-keyframes bump{0%{-webkit-transform:scale(1)}40%{-webkit-transform:scale(1.22)}100%{-webkit-transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@-webkit-keyframes wobble{0%,100%{-webkit-transform:translateX(0)}20%{-webkit-transform:translateX(-18px)}40%{-webkit-transform:translateX(16px)}60%{-webkit-transform:translateX(-10px)}80%{-webkit-transform:translateX(6px)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px)}40%{transform:translateX(16px)}60%{transform:translateX(-10px)}80%{transform:translateX(6px)}}
@-webkit-keyframes fall{0%{-webkit-transform:translateY(0) rotate(0)}100%{-webkit-transform:translateY(1250px) rotate(540deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(1250px) rotate(540deg)}}
@-webkit-keyframes burst{0%{-webkit-transform:scale(.4);opacity:1}100%{-webkit-transform:scale(1.8);opacity:0}}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
</style>

  /* ---------- Sudoku 4x4 ---------- */
  (function () {

    var sol = null, given = null, cellsEl = [], sel = -1, sym = null, left = 0, solved = 0, locked = false;
