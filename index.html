<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Lekeplassen">
<title>Lekeplassen</title>
<link rel="apple-touch-icon" id="icon" href="">
<style>
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#fff7e6;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;color:#3b3b4f}
.flex{display:-webkit-box;display:-webkit-flex;display:flex}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
.screen.on{display:block}
.top{position:absolute;top:0;left:0;right:0;height:96px;padding:12px 20px 0 20px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.back{width:76px;height:76px;border-radius:38px;background:#fff;font-size:42px;line-height:76px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.title{font-size:36px;font-weight:700;margin-left:20px}
.right{margin-left:auto;font-size:38px;font-weight:700}
.body{position:absolute;top:96px;left:0;right:0;bottom:0}
.wrap{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;-webkit-align-content:center;align-content:center;-webkit-align-items:center;align-items:center;height:100%;padding:10px}

/* Home */
#home .hero{text-align:center;font-size:54px;font-weight:800;padding-top:26px;height:110px;color:#ff6b6b;text-shadow:0 4px 0 rgba(0,0,0,.08)}
#home .tiles{position:absolute;top:110px;left:0;right:0;bottom:60px}
.tile{width:176px;height:164px;margin:9px;border-radius:30px;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.13);position:relative}
.tile .e{font-size:72px;line-height:100px;padding-top:8px}
.tile .t{font-size:22px;font-weight:700}
#home .tile.group{width:280px;height:280px;margin:18px;border-radius:44px}
#home .tile.group .e{font-size:140px;line-height:190px;padding-top:14px}
#home .tile.group .t{font-size:40px}
.tile .a{white-space:nowrap}
.emo{display:inline-block;width:1em;height:1em;vertical-align:-0.12em;background-image:url(emoji.png);background-repeat:no-repeat;-webkit-background-size:11em 11em;background-size:11em 11em}
.shadow{-webkit-filter:brightness(0);filter:brightness(0);opacity:.22}
.shadowS{-webkit-filter:brightness(0);filter:brightness(0);opacity:.85;display:inline-block}
.xbar{width:78px;margin:0 6px;border-radius:22px;position:relative;box-shadow:0 7px 0 rgba(0,0,0,.15)}
.xbar .pin{position:absolute;left:31px;width:16px;height:16px;border-radius:8px;background:rgba(255,255,255,.7)}
.tcell{width:200px;height:200px;margin:14px;border-radius:40px;background:#e9f8d8;position:relative;box-shadow:0 7px 0 rgba(0,0,0,.1);overflow:hidden}
.tcell .tan,.tcell .tbush{position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;line-height:200px}
.tcell .tan{font-size:120px;opacity:0;-webkit-transform:translateY(60px);transform:translateY(60px);-webkit-transition:all .35s;transition:all .35s}
.tcell .tbush{font-size:170px;-webkit-transition:all .35s;transition:all .35s}
.tcell.open .tan{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}
.tcell.open .tbush{opacity:.18;-webkit-transform:translateY(70px) scale(.8);transform:translateY(70px) scale(.8)}
.mtarget{position:absolute;border-radius:36px;background:rgba(255,255,255,.7);border:5px dashed #d8cdb8;text-align:center}
.mtarget.fed{background:#d9f7e3;border-color:#3cc76b}
.mitem{position:absolute;border-radius:36px;background:#fff;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.13)}
.mitem.lift{box-shadow:0 18px 20px rgba(0,0,0,.25)}
.scratchpic{text-align:center}
.scratchpic .bigemoji{font-size:300px;position:absolute;left:0;right:0;top:50%;margin-top:-190px;line-height:380px}
canvas{-webkit-transition:opacity .6s;transition:opacity .6s}
.sky{background:-webkit-linear-gradient(top,#9fd8ff,#e9f7ff 75%,#9be07a 75%);background:linear-gradient(#9fd8ff,#e9f7ff 75%,#9be07a 75%)}
.catcher{position:absolute;left:0;top:0;width:120px;height:120px;font-size:110px;line-height:120px;text-align:center}
.faller{position:absolute;left:0;top:0;width:80px;height:80px;font-size:70px;line-height:80px;text-align:center}
.mhole{width:200px;height:170px;margin:12px;position:relative;overflow:hidden;border-radius:30px}
.mhole .mound{position:absolute;left:15px;right:15px;bottom:10px;height:56px;border-radius:50%;background:#7a4b2a;box-shadow:inset 0 10px 0 rgba(0,0,0,.35)}
.mhole .critter{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:100px;line-height:120px;-webkit-transform:translateY(130px);transform:translateY(130px);-webkit-transition:-webkit-transform .18s;transition:transform .18s}
.mhole.up .critter{-webkit-transform:translateY(0);transform:translateY(0)}
.mslot{width:92px;height:92px;margin:6px;border-radius:24px;background:#fff;font-size:62px;line-height:92px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.mslot.q{background:#fff3c4;border:4px dashed #f7c531;color:#c99a00;font-weight:800}
.mslot.ok{background:#d9f7e3}
.dpad{position:absolute;right:16px;bottom:16px;width:216px;height:216px}
.dpad div{position:absolute;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.85);font-size:44px;line-height:72px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.dpad div[data-d=u]{left:72px;top:0}.dpad div[data-d=d]{left:72px;top:144px}.dpad div[data-d=l]{left:0;top:72px}.dpad div[data-d=r]{left:144px;top:72px}
.stile{position:absolute;border-radius:8px;-webkit-transition:left .15s,top .15s;transition:left .15s,top .15s;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.scell{position:absolute;background:#fff;border-radius:12px;text-align:center}
.scell.given{background:#f1ecff}
.scell.sel{background:#fff3c4;box-shadow:inset 0 0 0 5px #f7c531}
.scell.ok{background:#d9f7e3}
.spal{position:absolute;text-align:center}
.clockch{position:absolute;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center}
.clockbtn{width:320px;margin:12px;padding:16px 10px;border-radius:30px;color:#fff;font-size:36px;font-weight:800;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.15)}
.clockbtn small{display:block;font-size:24px;opacity:.85;font-weight:700}
#road{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#8fd16a}
#road .lane{position:absolute;left:0;right:0;top:50%;height:190px;margin-top:-95px;background:#5b5b66}
#road .lane:after{content:'';position:absolute;left:0;right:0;top:91px;height:8px;background:-webkit-repeating-linear-gradient(left,#fff 0,#fff 50px,transparent 50px,transparent 100px);background:repeating-linear-gradient(90deg,#fff 0,#fff 50px,transparent 50px,transparent 100px)}
#car{position:absolute;left:0;top:0;font-size:110px;line-height:1;margin:-55px 0 0 -55px}
.star{position:absolute;font-size:64px;margin:-32px 0 0 -32px}
.word{font-size:110px;font-weight:800;letter-spacing:8px;color:#3b3b4f}
.pic{width:200px;height:200px;margin:18px;border-radius:44px;background:#fff;font-size:130px;line-height:200px;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.12)}
.choices,#countArea,#abcGrid{height:auto}
#home .tiles{bottom:20px;height:auto}
.tip{font-size:12px;bottom:8px}
.sum{font-size:64px;text-align:center;line-height:1.2;padding:0 20px}
.tile .a{position:absolute;top:10px;right:14px;background:#fff;border-radius:14px;font-size:17px;font-weight:700;padding:3px 10px;opacity:.85}
.tip{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;color:#a79c88;padding:0 20px}

/* generic big button */
.big{width:150px;height:150px;margin:12px;border-radius:36px;background:#fff;font-size:96px;line-height:150px;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.12)}

/* Balloons */
#bArea{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:-webkit-linear-gradient(top,#bfe6ff,#eaf7ff);background:linear-gradient(#bfe6ff,#eaf7ff)}
.balloon{position:absolute;left:0;top:0;width:112px;height:138px;border-radius:50% 50% 48% 48% / 56% 56% 44% 44%;box-shadow:inset -12px -16px 0 rgba(0,0,0,.13)}
.balloon:before{content:'';position:absolute;left:24px;top:22px;width:20px;height:32px;border-radius:50%;background:rgba(255,255,255,.55)}
.balloon:after{content:'';position:absolute;left:55px;top:138px;width:2px;height:70px;background:rgba(0,0,0,.25)}
.burst{position:absolute;font-size:80px;pointer-events:none;-webkit-animation:burst .6s forwards;animation:burst .6s forwards}

/* Drawing */
#palette{position:absolute;top:0;left:0;bottom:0;width:100px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.sw{border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15);margin:3px 0;text-align:center}
.sw.sel{border-color:#3b3b4f}
#canvasBox{position:absolute;top:0;left:100px;right:16px;bottom:16px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.1)}
#canvas{display:block}

/* ABC */
#abcShow{height:210px;text-align:center;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
#abcShow .L{font-size:150px;font-weight:800;color:#ff6b6b;line-height:1}
#abcShow .E{font-size:120px;margin:0 30px}
#abcShow .W{font-size:52px;font-weight:700}
#abcGrid{position:absolute;top:210px;left:0;right:0;bottom:0;-webkit-align-content:flex-start;align-content:flex-start}
.letter{width:80px;height:80px;margin:6px;border-radius:22px;font-size:46px;font-weight:800;line-height:80px;text-align:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}

/* Find letter / counting choices */
.prompt{height:120px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:40px;font-weight:700}
.speaker{width:90px;height:90px;border-radius:45px;background:#fff;font-size:50px;line-height:90px;text-align:center;margin-left:24px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.choices{position:absolute;top:120px;left:0;right:0;bottom:0}
.choice{width:200px;height:200px;margin:18px;border-radius:44px;font-size:140px;font-weight:800;line-height:200px;text-align:center;color:#fff;box-shadow:0 9px 0 rgba(0,0,0,.15)}
#countArea{position:absolute;top:110px;left:30px;right:30px;bottom:200px;background:#fff;border-radius:30px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.obj{font-size:86px;width:120px;height:120px;line-height:120px;text-align:center;margin:6px;position:relative}
.obj.done{opacity:.45}
.obj .n{position:absolute;right:4px;top:4px;width:44px;height:44px;border-radius:22px;background:#ff6b6b;color:#fff;font-size:28px;line-height:44px;font-weight:800;opacity:1}
#countChoices{position:absolute;left:0;right:0;bottom:10px;height:180px;padding:0}
#countChoices .choice{width:150px;height:150px;font-size:96px;line-height:150px;margin:0 20px;border-radius:36px}

/* Memory */
#mGrid{padding:14px 30px}
.card{width:21%;height:29%;margin:1.5%;border-radius:28px;font-size:84px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.13);background:#7c6cff;color:#fff;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.card.up{background:#fff}
.card.ok{background:#d9f7e3}
.again{position:absolute;left:50%;top:50%;width:320px;margin-left:-160px;margin-top:-60px;height:120px;border-radius:40px;background:#3cc76b;color:#fff;font-size:44px;font-weight:800;line-height:120px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18);display:none}

/* FX */
#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50}
.conf{position:absolute;top:-80px;-webkit-animation-name:fall;animation-name:fall;-webkit-animation-timing-function:linear;animation-timing-function:linear;-webkit-animation-fill-mode:forwards;animation-fill-mode:forwards}
.bump{-webkit-animation:bump .45s;animation:bump .45s}
.wobble{-webkit-animation:wobble .5s;animation:wobble .5s}
@-webkit-keyframes bump{0%{-webkit-transform:scale(1)}40%{-webkit-transform:scale(1.22)}100%{-webkit-transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@-webkit-keyframes wobble{0%,100%{-webkit-transform:translateX(0)}20%{-webkit-transform:translateX(-18px)}40%{-webkit-transform:translateX(16px)}60%{-webkit-transform:translateX(-10px)}80%{-webkit-transform:translateX(6px)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px)}40%{transform:translateX(16px)}60%{transform:translateX(-10px)}80%{transform:translateX(6px)}}
@-webkit-keyframes fall{0%{-webkit-transform:translateY(0) rotate(0)}100%{-webkit-transform:translateY(1250px) rotate(540deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(1250px) rotate(540deg)}}
@-webkit-keyframes burst{0%{-webkit-transform:scale(.4);opacity:1}100%{-webkit-transform:scale(1.8);opacity:0}}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
</style>
